<style>
:root{--cyan:#00f5e1;--green:#00ed91;--blue:#087cff;--gold:#ffd43b;--pink:#ff2794;--panel:#090e10;--line:#0acdbb}

html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#030606;color:#fff;line-height:1.55;font-size:17px;overflow-x:hidden}

a{color:inherit}
header{position:sticky;top:0;z-index:20;background:#050708f5;border-bottom:2px solid var(--cyan);padding:12px 4%;display:flex;align-items:center;justify-content:space-between;gap:15px;backdrop-filter:blur(10px)}

.hero{width:min(1200px,94%);margin:auto;padding:38px 0 18px;display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:center}

.hero-art{min-height:240px;border:1px solid #00f5e166;border-radius:24px;background:linear-gradient(140deg,#051c25,#0a1017 55%,#062e2b);display:flex;align-items:center;justify-content:center;font-size:clamp(70px,12vw,130px);position:relative;overflow:hidden;box-shadow:0 0 25px #00f5e122}
.hero-art:after{content:"";position:absolute;width:240px;height:240px;border:2px solid #00f5e155;border-radius:50%;animation:spin 12s linear infinite}
.hero-art span{filter:drop-shadow(0 0 18px #00f5e1);animation:float 3s ease-in-out infinite}
.pills{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}
.pill{font-weight:800;border:1px solid #fff3;border-radius:999px;padding:6px 12px;background:#101719}
.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}
.btn,button{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:13px 18px;border:0;border-radius:12px;background:var(--cyan);color:#00100e;text-decoration:none;font-size:16px;font-weight:900;cursor:pointer;transition:.2s}
.btn:hover,button:hover{transform:translateY(-2px);box-shadow:0 0 17px #00f5e166}
.btn.blue{background:var(--blue);color:white}.btn.green{background:var(--green);color:#00150b}.btn.yellow{background:var(--gold);color:#201900}
.offer{position:relative;isolation:isolate;overflow:hidden;width:min(1200px,94%);margin:16px auto 28px;padding:24px 18px;border:2px solid #fff;border-radius:20px;background:linear-gradient(110deg,#ff6a00,#ffd52a 40%,#ff3e35 75%,#ff1685);color:#1a0800;box-shadow:0 0 24px #ff8a2e55;text-align:center}
.offer:before{content:"";position:absolute;z-index:-1;inset:-100%;background:linear-gradient(110deg,transparent 45%,#ffffff80 50%,transparent 55%);animation:shine 4s linear infinite}
.offer .tag{display:inline-block;background:#c80019;color:white;padding:5px 15px;border-radius:999px;font-weight:950;letter-spacing:.5px}
.offer h2{font-size:clamp(25px,4.4vw,43px);font-weight:950;margin:6px 0}
.offer p{font-weight:850;font-size:clamp(16px,2.3vw,22px)}
.offer .btn{background:#fff;color:#d00000;margin-top:12px}
.section{width:min(1200px,94%);margin:32px auto}
.section-title{font-size:clamp(27px,4vw,39px);font-weight:950;margin:0 0 18px;line-height:1.2}
.section-title span{color:var(--cyan)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.card{background:linear-gradient(145deg,#0b1416,#070a0b);border:1px solid #0cb5a6;border-radius:16px;padding:18px;box-shadow:0 0 12px #00f5e10b;transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 0 18px #00f5e126}
.card .emoji{font-size:35px}.card h3{font-size:20px;font-weight:950;margin:4px 0;color:var(--cyan)}.card p{font-size:16px;color:#e0e8e8}
.booking-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(270px,.8fr);gap:16px;align-items:stretch}
.panel{background:linear-gradient(145deg,#071315,#080a0c);border:2px solid var(--cyan);border-radius:20px;padding:clamp(16px,2.5vw,26px);box-shadow:0 0 18px #00f5e120}
.panel h2{font-size:clamp(25px,3.5vw,36px);font-weight:950;color:var(--cyan);line-height:1.2;margin-bottom:8px}
.intro{font-size:17px;font-weight:700;color:#e1eeee;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{min-width:0}.full{grid-column:1/-1}
label{display:block;font-weight:850;font-size:16px;margin:4px 0}
input,select,textarea{display:block;width:100%;padding:14px 13px;margin:5px 0 8px;background:#f6f8fa;color:#111;border:2px solid #d4dce2;border-radius:10px;font-size:17px;font-weight:600;min-height:50px}
textarea{min-height:105px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #00f5e155;border-color:#00bcae}
.hint{font-size:14px;color:#d2e0e0;line-height:1.5}
.status{background:#10191a;border:1px solid #284344;border-radius:10px;padding:12px;margin-top:10px;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.actions button{flex:1}
.payment-panel{text-align:center}
.payment-panel h2{color:var(--gold)}
.price{font-size:clamp(32px,5vw,46px);font-weight:950;color:var(--gold)}
.qr{margin:15px auto;text-align:center}
.qr img{width:220px;max-width:80%;background:#fff;padding:7px;border:3px solid var(--cyan);border-radius:15px;box-shadow:0 0 18px #00f5e155}
.qr-placeholder{padding:20px;border:1px dashed #9ca3af;border-radius:12px;color:#e5e7eb}
.blogs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.blog-btn{display:block;padding:17px;border:1px solid #0cb5a6;border-radius:13px;background:#0b1214;text-decoration:none;font-weight:850;font-size:17px}
.blog-btn:hover{background:#07302d}
.reviews-note{font-size:15px;color:#d2e0e0;margin:10px 0}
.review-item{margin-top:12px;padding:14px;background:#10191a;border-left:4px solid var(--cyan);border-radius:9px;overflow-wrap:anywhere}
.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.contact-card{padding:18px;border:1px solid #0cb5a6;border-radius:14px;background:#0b1214;font-weight:750}
.contact-card strong{display:block;color:var(--cyan);font-size:18px;margin-bottom:4px}
footer{text-align:center;border-top:1px solid #0cb5a6;padding:22px 12px;color:#d7e0e0;font-size:14px}
[hidden]{display:none!important}
@keyframes shine{0%{transform:translateX(-35%)}100%{transform:translateX(35%)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:800px){header{align-items:flex-start;flex-direction:column}nav{justify-content:flex-start}nav a{font-size:14px}.hero{grid-template-columns:1fr}.hero-art{min-height:150px}.booking-layout{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.blogs{grid-template-columns:repeat(2,minmax(0,1fr))}.contact-grid{grid-template-columns:1fr}}
@media(max-width:480px){body{font-size:16px}.hero{padding-top:28px}.cards{gap:9px}.card{padding:13px}.card h3{font-size:18px}.card p{font-size:15px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.blogs{grid-template-columns:1fr}.btn,button{width:100%}.buttons .btn{width:auto;flex:1}.section{margin:25px auto}.section-title{margin-bottom:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

@keyframes offerBackground{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes offerBorderGlow{from{box-shadow:0 0 10px #ffd54a55, inset 0 0 10px #ff5e0033}to{box-shadow:0 0 30px #ffd54aaa, inset 0 0 20px #ff5e0055}}
@keyframes sparkleDrift{from{transform:translateX(-15%)}to{transform:translateX(15%)}}
@keyframes tagBounce{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}

.banner{animation:bannerGlow 3s ease-in-out infinite alternate}

@keyframes bannerGlow{from{box-shadow:0 0 10px #00ffe133}to{box-shadow:0 0 28px #00ffe177}}

.card,.blog-btn,.review-item{transform:translateZ(0);transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}

.card:nth-child(2n){animation-delay:.7s}.card:nth-child(3n){animation-delay:1.4s}

.card h3{animation:miniGlow 3s ease-in-out infinite alternate}
@keyframes cardGlow{from{box-shadow:0 0 4px #00ffe111}to{box-shadow:0 0 13px #00ffe133}}

.section-title{animation:sectionGlow 3s ease-in-out infinite alternate}
